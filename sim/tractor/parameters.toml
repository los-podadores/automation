# Valores de simulación provisionales: no son especificaciones del tractor real.
# La geometría se obtiene de cad/TRACTOR.stp al ejecutar build_model.py.
[physics]
chassis_mass_kg = 300.0
rear_wheel_mass_kg = 35.0
front_wheel_mass_kg = 20.0
knuckle_mass_kg = 2.0
friction = 0.9

[control]
forward_speed_mps = 0.6
reverse_speed_mps = 0.35
max_steering_rad = 0.4
steering_rate_radps = 0.6
acceleration_mps2 = 0.6
publish_hz = 30.0
