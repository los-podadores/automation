[project]
name = "los-podadores-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "opencv-python-headless>=5.0.0.93",
    "pygame-ce>=2.5.8",
    "ray[rllib]>=2.40",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
