# Distrobox configuration for Los Podadores Gazebo Harmonic & ROS 2 Jazzy environment
# Run with: distrobox assemble create --file scripts/distrobox.ini

[gazebo-harmonic]
image=osrf/ros:jazzy-desktop-full
additional_packages="gz-harmonic ros-jazzy-ros-gz mesa-utils qtwayland5"
additional_flags="--log-driver json-file"
init=false
nvidia=false
pull=true
root=false
init_hooks="echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable noble main' | tee /etc/apt/sources.list.d/gazebo-stable.list && wget https://packages.osrfoundation.org/gazebo.gpg -O /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg && apt-get update"
